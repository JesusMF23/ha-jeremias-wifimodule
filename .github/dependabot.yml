version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    groups:
      test-tools:
        patterns: ['pytest', 'pytest-asyncio', 'ruff']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
