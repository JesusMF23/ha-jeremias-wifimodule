name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: ruff check .
      - run: ruff format --check .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check custom_components/wifimodule/frontend/panel.js
      - run: npx --yes prettier@3.6.2 --check 'custom_components/wifimodule/frontend/*.js'
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
