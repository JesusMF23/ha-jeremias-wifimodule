name: Validate
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '23 6 * * 1'
permissions:
  contents: read
jobs:
  tests:
    name: Tests (${{ matrix.core }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core: [minimum, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Test minimum supported Home Assistant
        if: matrix.core == 'minimum'
        run: pip install 'homeassistant==2026.9.0'
      - name: Test latest stable Home Assistant
        if: matrix.core == 'latest'
        run: pip install --upgrade homeassistant
      - run: pytest -q
      - run: ruff check .
      - run: ruff format --check .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
