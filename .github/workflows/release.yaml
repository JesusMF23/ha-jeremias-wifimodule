name: Release
on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/validate.yaml
    permissions:
      contents: read
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Require a validated commit from main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Validate version and build install ZIP
        run: python scripts/release.py --tag "$GITHUB_REF_NAME" --output dist
      - name: Publish a normal release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/jeremias-wifimodule-$GITHUB_REF_NAME-install.zip" \
            "dist/jeremias-wifimodule-$GITHUB_REF_NAME-install.zip.sha256" \
            --verify-tag --latest --prerelease=false \
            --title "Jeremias / WifiModule $GITHUB_REF_NAME" --generate-notes
